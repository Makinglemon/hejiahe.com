<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.10   0 0 0 0 0.09   0 0 0 0 0.08   0 0 0 0.08 0"/>
    </filter>
    <!-- Paper vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#F2EDE2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#50361C" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#F2EDE2"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Top-left: ochre dot + kicker -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#6B6555" font-size="15" letter-spacing="4">
    <circle cx="80" cy="78" r="5" fill="#B8532A"/>
    <text x="96" y="83">// OPEN TO WORK · CLASS OF 2026</text>
  </g>

  <!-- Top-right: filed-under -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#6B6555" font-size="13" letter-spacing="3" text-anchor="end">
    <text x="1120" y="83">CASE FILE / 何嘉禾 CAMERON HE</text>
  </g>

  <!-- Main name in ink -->
  <g font-family="'Space Grotesk', 'PingFang SC', sans-serif" font-weight="600">
    <text x="80" y="285" font-size="176" fill="#1A1815" letter-spacing="-4">何嘉禾</text>
    <text x="80" y="355" font-size="56" fill="#B8532A" letter-spacing="-1">一个探险家</text>
  </g>
  <line x1="80" y1="372" x2="420" y2="372" stroke="#B8532A" stroke-width="2"/>

  <!-- Sub lines -->
  <g font-family="'Inter', 'PingFang SC', sans-serif" fill="#3B3730" font-size="22">
    <text x="80" y="432">上海理工 · 数据科学 · 美团 / eBay / Museland / 易海创腾 四段实习</text>
  </g>
  <g font-family="'Inter', 'PingFang SC', sans-serif" fill="#6B6555" font-size="20" font-style="italic">
    <text x="80" y="468">用数据看清问题，用商务解决问题。</text>
  </g>

  <!-- 4 narrative chapter tags -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#6B6555" letter-spacing="2">
    <g>
      <circle cx="88" cy="518" r="5" fill="#B8532A"/>
      <text x="100" y="522">MEITUAN · 标签 PM</text>
    </g>
    <g>
      <circle cx="290" cy="518" r="5" fill="#2E5B7E"/>
      <text x="302" y="522">EBAY · 品类</text>
    </g>
    <g>
      <circle cx="450" cy="518" r="5" fill="#4C6B3D"/>
      <text x="462" y="522">MUSELAND · 评测</text>
    </g>
    <g>
      <circle cx="690" cy="518" r="5" fill="#B89141"/>
      <text x="702" y="522">YEEHAI · SEO/SEM</text>
    </g>
  </g>

  <!-- Bottom rule + meta strip -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#1A1815" stroke-opacity="0.15"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#6B6555" letter-spacing="2.5">
    <text x="80" y="595">CAMERON HE  ·  SHANGHAI  ·  jiahe_he@outlook.com</text>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#6B6555" letter-spacing="2.5" text-anchor="end">
    <text x="1120" y="595">ISSUE N°4 · 2026</text>
  </g>

  <!-- Wax-seal mark -->
  <g transform="translate(1000, 215)">
    <circle cx="80" cy="80" r="80" fill="#B8532A"/>
    <circle cx="80" cy="80" r="80" fill="none" stroke="#1A1815" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#F2EDE2" stroke-opacity="0.45" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F2EDE2" letter-spacing="3">EXPLORER</text>
    <text x="80" y="100" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="700" fill="#F2EDE2">何</text>
    <text x="80" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F2EDE2" letter-spacing="2">C/2026</text>
  </g>
</svg>
