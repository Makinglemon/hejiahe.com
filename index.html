  <style>
    /* ============================================================
       EDITORIAL PALETTE — the single source of truth
       ============================================================ */
    :root {
      /* Paper */
      --paper:       #F2EDE2;   /* main bg — warm ivory */
      --paper-hi:    #FAF6EC;   /* card / elevated */
      --paper-lo:    #E6DFCE;   /* pressed / subtle section */
      --rule:        #D8CFB8;   /* hairline */
      --rule-soft:   rgba(26,24,21,0.08);

      /* Ink */
      --ink-1:       #1A1815;   /* primary text */
      --ink-2:       #3B3730;   /* body */
      --ink-3:       #6B6555;   /* meta / caption */
      --ink-4:       #968F7C;   /* placeholder */

      /* Accent + narrative chapter colors */
      --accent:      #B8532A;   /* editorial ochre — primary brand */
      --accent-hi:   #D26A3E;   /* hover */
      --accent-lo:   #8F3E1E;   /* pressed */
      --accent-bg:   rgba(184,83,42,0.08);

      --n-meituan:   #B8532A;   /* chapter 1 — 美团 (ochre) */
      --n-ebay:      #2E5B7E;   /* chapter 2 — eBay (navy) */
      --n-zhulu:     #4C6B3D;   /* chapter 3 — 逐路行 AI (olive) */
      --n-yeehai:    #B89141;   /* chapter 4 — 易海创腾 (amber) */
    }

    html, body { background: var(--paper); color: var(--ink-1); }
    html { scroll-behavior: smooth; }
    body { font-feature-settings: "ss01", "cv11"; }

    /* Selection */
    ::selection { background: var(--accent); color: var(--paper); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

    /* Grid backdrop — subtle ink grid on paper */
    .bg-grid {
      background-image:
        linear-gradient(to right, rgba(26,24,21,0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(26,24,21,0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%);
    }

    /* Paper grain — dark fibers multiplied onto paper */
    .bg-noise::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      opacity: 0.55;
      mix-blend-mode: multiply;
    }

    /* Accent heading — subtle ochre wash (no longer a neon gradient) */
    .grad-text {
      color: var(--accent);
      position: relative;
      display: inline-block;
    }
    .grad-text::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -0.06em; height: 0.38em;
      background: var(--accent);
      opacity: 0.10;
      border-radius: 2px;
      z-index: -1;
      transform-origin: left;
      animation: underlineIn 1.2s cubic-bezier(.2,.8,.2,1) .6s both;
    }
    @keyframes underlineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* Soft color washes — pale sepia / peach, barely there */
    .blob { position: absolute; border-radius: 9999px; filter: blur(90px); opacity: 0.32; }
    .blob-1 { width: 520px; height: 520px; background: #E2B79A; top: -120px; left: -120px; animation: float1 18s ease-in-out infinite; }
    .blob-2 { width: 460px; height: 460px; background: #C8B88A; top: 20%; right: -140px; animation: float2 22s ease-in-out infinite; }
    .blob-3 { width: 380px; height: 380px; background: #B8CBB0; bottom: -120px; left: 30%; animation: float3 24s ease-in-out infinite; opacity: 0.22; }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,80px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-80px,60px)} }
    @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-60px)} }

    /* Ruled border — editorial hairline */
    .neon-border {
      position: relative;
      background: var(--paper-hi);
      border: 1px solid var(--rule);
    }
    .neon-border:hover { border-color: var(--accent); box-shadow: 0 4px 24px -8px rgba(184,83,42,0.25); }

    /* Card — paper with thin ink hairline */
    .glow-card {
      position: relative;
      background: var(--paper-hi);
      border: 1px solid var(--rule);
      transition: transform .4s ease, border-color .4s ease, box-shadow .4s ease;
    }
    .glow-card::before {
      content: "";
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(400px circle at var(--mx,50%) var(--my,50%), rgba(184,83,42,0.08), transparent 40%);
      opacity: 0; transition: opacity .4s ease;
    }
    .glow-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 14px 40px -18px rgba(26,24,21,0.25); }
    .glow-card:hover::before { opacity: 1; }

    /* Marquee */
    @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    .marquee-track { animation: marquee 40s linear infinite; }

    /* Reveal on scroll */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    /* Cursor glow — paper warm spotlight */
    .cursor-glow {
      position: fixed; pointer-events: none; z-index: 2;
      width: 500px; height: 500px; border-radius: 9999px;
      background: radial-gradient(circle, rgba(184,83,42,0.08), transparent 60%);
      transform: translate(-50%,-50%);
      transition: opacity .3s;
      mix-blend-mode: multiply;
    }

    /* Button — editorial primary (filled ink) + ghost (ink outline) */
    .btn-primary {
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 1.4rem; border-radius: 9999px;
      background: var(--ink-1);
      color: var(--paper); font-weight: 600; letter-spacing: .01em;
      border: 1px solid var(--ink-1);
      transition: background .25s ease, color .25s ease, transform .3s ease, box-shadow .3s ease;
    }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 24px -10px rgba(184,83,42,0.5); }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 1.4rem; border-radius: 9999px;
      border: 1px solid var(--ink-1);
      color: var(--ink-1); font-weight: 500;
      background: transparent;
      transition: all .25s ease;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

    /* Section label — editorial kicker */
    .section-label { display: inline-flex; align-items: center; gap: .6rem; font-family: "JetBrains Mono", monospace; font-size: .72rem; color: var(--ink-3); letter-spacing: .18em; text-transform: uppercase; }
    .section-label::before { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--accent); }

    /* Hero number ticker line */
    .ticker { font-family: "JetBrains Mono", monospace; font-size: .78rem; color: var(--ink-3); letter-spacing: .04em; }

    /* Nav — paper pill */
    .nav-pill { backdrop-filter: blur(14px); background: rgba(250,246,236,0.75); border: 1px solid var(--rule); }

    /* --- NEW EFFECTS --- */

    /* Scroll progress bar — single ochre line, no glow */
    .scroll-progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100; pointer-events: none; }
    .scroll-progress > div { height: 100%; background: var(--accent); transition: width .08s linear; }

    /* Pop-in keyframe for gradient word in hero */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(36px) scale(.92); filter: blur(8px); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .pop-in { animation: popIn 1s cubic-bezier(.2,.9,.3,1.15) .3s both; display: inline-block; }

    /* Tilt container (smooth perspective) */
    .tilt-wrap { transform-style: preserve-3d; transition: transform .4s cubic-bezier(.2,.7,.2,1); }

    /* Pulse dot for open-to-work */
    @keyframes softPulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .soft-pulse { animation: softPulse 2s ease-in-out infinite; }

    /* Experience row subtle hover */
    .exp-row { position: relative; }
    .exp-row::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background: var(--accent); transition: width .6s cubic-bezier(.2,.7,.2,1); }
    .exp-row:hover::after { width: 100%; }

    /* ===== TIER-1 POLISH ADDITIONS ===== */

    /* Paper grain — slow subtle breathe */
    @keyframes grainBreathe { 0%,100% { opacity: 0.45; } 50% { opacity: 0.68; } }
    .bg-noise::after { animation: grainBreathe 5s ease-in-out infinite; }

    /* Edge vignette — gentle paper shadow at corners (not cinema black) */
    .vignette::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(80,60,30,0.10) 100%);
    }

    /* Custom cursor — ink ring + ochre dot, multiply blend for paper */
    .custom-cursor {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 99;
      width: 28px; height: 28px;
      margin: -14px 0 0 -14px;
      border: 1px solid rgba(26,24,21,0.45);
      border-radius: 50%;
      transition: width .28s cubic-bezier(.2,.7,.2,1),
                  height .28s cubic-bezier(.2,.7,.2,1),
                  margin .28s cubic-bezier(.2,.7,.2,1),
                  border-color .28s,
                  background-color .28s,
                  opacity .2s;
      will-change: transform;
    }
    .custom-cursor-dot {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100;
      width: 5px; height: 5px;
      margin: -2.5px 0 0 -2.5px;
      background: var(--accent);
      border-radius: 50%;
      transition: background-color .25s, transform .15s, width .2s, height .2s, margin .2s;
      will-change: transform;
    }
    html.cursor-hover .custom-cursor {
      width: 56px; height: 56px;
      margin: -28px 0 0 -28px;
      background-color: rgba(184,83,42,0.08);
      border-color: var(--accent);
    }
    html.cursor-hover .custom-cursor-dot {
      background: var(--ink-1);
      width: 7px; height: 7px;
      margin: -3.5px 0 0 -3.5px;
    }

    /* Logo wall — editorial past-employer list */
    .logo-mark {
      position: relative; padding-left: 22px;
      transition: transform .45s cubic-bezier(.2,.7,.2,1);
      cursor: default;
    }
    .logo-mark:hover { transform: translateX(3px); }
    .brand-mark-wrap {
      display: flex;
      align-items: center;
      height: 64px;
      margin-left: -22px;            /* align brand mark to row gutter */
      margin-bottom: 16px;
      opacity: 0.92;
      transition: opacity .45s, transform .45s cubic-bezier(.2,.7,.2,1), filter .45s;
    }
    .brand-mark-wrap svg {
      filter: saturate(0.85);
      transition: filter .45s, transform .45s;
    }
    .logo-mark:hover .brand-mark-wrap {
      opacity: 1;
      transform: translateY(-2px);
    }
    .logo-mark:hover .brand-mark-wrap svg {
      filter: saturate(1);
    }
    .exp-brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      opacity: 0.85;
      transition: opacity .35s, transform .45s cubic-bezier(.2,.7,.2,1);
    }
    .exp-row:hover .exp-brand-mark {
      opacity: 1;
      transform: scale(1.08);
    }
    .logo-dot {
      position: absolute; left: 0; top: 90px;        /* sits below brand mark */
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rule);
      transition: background-color .45s, transform .45s;
    }
    .logo-mark:hover .logo-dot {
      background: var(--accent, #B8532A);
      transform: scale(1.25);
    }
    .logo-name {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      font-weight: 600;
      color: var(--ink-4);
      letter-spacing: -0.01em;
      transition: color .45s;
    }
    .logo-mark:hover .logo-name { color: var(--ink-1); }
    .logo-cn {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--ink-4);
      margin-top: 4px;
      letter-spacing: 0.05em;
      transition: color .45s;
    }
    .logo-mark:hover .logo-cn { color: var(--accent, #B8532A); }
    .logo-period {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--ink-4);
      margin-top: 6px;
      letter-spacing: 0.12em;
    }

    /* Hero constellation canvas — floats behind hero text */
    .hero-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: -5;
      pointer-events: none;
      opacity: 1;
    }

    /* ===== TIER-2 — Award-track polish (editorial version) ===== */

    /* Convergence SVG — 4 narrative-color paths → single ink dot */
    .converge-svg {
      width: 100%;
      height: clamp(70px, 10vw, 130px);
      display: block;
      margin: 0 0 1.5rem;
      overflow: visible;
    }
    .converge-path {
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 1.6s cubic-bezier(.6,.05,.25,1);
    }
    .converge-svg.in .converge-path:nth-child(5) { transition-delay: 0s; }
    .converge-svg.in .converge-path:nth-child(6) { transition-delay: .18s; }
    .converge-svg.in .converge-path:nth-child(7) { transition-delay: .36s; }
    .converge-svg.in .converge-path:nth-child(8) { transition-delay: .54s; }
    .converge-svg.in .converge-path { stroke-dashoffset: 0; }
    .converge-end {
      fill: var(--ink-1);
      opacity: 0;
      transform-origin: center;
      transition: opacity .6s 1.1s, transform .6s 1.1s;
    }
    .converge-svg.in .converge-end { opacity: 1; }
    .converge-end-pulse {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1;
      opacity: 0;
      transform-origin: 1180px 70px;
    }
    .converge-svg.in .converge-end-pulse {
      animation: pulseRing 2.4s ease-out 1.4s infinite;
    }
    @keyframes pulseRing {
      0% { opacity: .8; transform: scale(.5); }
      100% { opacity: 0; transform: scale(3); }
    }

    /* Case-study trigger — ink underline link, ochre on hover */
    .case-trigger {
      display: inline-flex; align-items: center; gap: .35rem;
      margin-top: .8rem;
      font-family: "JetBrains Mono", monospace;
      font-size: .72rem;
      color: var(--ink-1);
      border-bottom: 1px solid var(--ink-1);
      padding: 0 0 1px;
      cursor: pointer;
      background: none;
      transition: color .3s, border-color .3s, gap .3s;
    }
    .case-trigger:hover { color: var(--accent); border-color: var(--accent); gap: .55rem; }

    /* Modal — paper card on dim warm backdrop */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(26,24,21,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 4rem 1.25rem 3rem;
      overflow-y: auto;
      animation: backdropIn .35s ease-out;
    }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card {
      position: relative;
      width: min(960px, 100%);
      background: var(--paper-hi);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 2.25rem 2rem 2.5rem;
      box-shadow: 0 40px 100px -20px rgba(26,24,21,0.45);
      animation: modalIn .5s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(28px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }
    /* Top accent rule — editorial "filed under" */
    .modal-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 8px 8px 0 0;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid var(--rule);
      color: var(--ink-1);
      font-family: "JetBrains Mono", monospace; font-size: 1.05rem;
      cursor: pointer;
      transition: background .25s, color .25s, border-color .25s, transform .35s;
    }
    .modal-close:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); transform: rotate(90deg); }
    .modal-section { margin-top: 2rem; }
    .modal-section h4 {
      font-family: "JetBrains Mono", monospace;

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;
    const CONTENT = JSON.parse(document.getElementById('site-content').textContent);

    // Helper: pull localized string from a field that may be { zh, en } or a plain string
    const loc = (v, lang) => (v && typeof v === 'object' && 'zh' in v) ? v[lang] : v;

    // ——— Scroll progress bar (thin gradient at top of viewport) ———
    function ScrollProgress() {
      const [p, setP] = useState(0);
      useEffect(() => {
        const update = () => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          setP(max > 0 ? (h.scrollTop / max) * 100 : 0);
        };
        window.addEventListener('scroll', update, { passive: true });
        update();
        return () => window.removeEventListener('scroll', update);
      }, []);
      return <div className="scroll-progress"><div style={{ width: `${p}%` }} /></div>;
    }

    // ——— Animated number counter (parses "+15%", "1万+", "4", "28%", "∞" etc.) ———
    function Counter({ value, className = "" }) {
      const match = String(value).match(/^([^\d]*)(\d+(?:\.\d+)?)(.*)$/);
      const initial = match ? (match[1] + '0' + match[3]) : String(value);
      const [display, setDisplay] = useState(initial);
      const ref = useRef(null);
      useEffect(() => {
        if (!match) { setDisplay(String(value)); return; }
        const el = ref.current; if (!el) return;
        const [, prefix, numStr, suffix] = match;
        const target = parseFloat(numStr);
        const isInt = Number.isInteger(target);
        const io = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) {
            io.disconnect();
            const t0 = performance.now();
            const dur = 1600;
            const tick = (now) => {
              const t = Math.min(1, (now - t0) / dur);
              const eased = 1 - Math.pow(1 - t, 3);
              const curr = target * eased;
              setDisplay(prefix + (isInt ? Math.round(curr) : curr.toFixed(1)) + suffix);
              if (t < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        }, { threshold: 0.4 });
        io.observe(el);
        return () => io.disconnect();
      }, [value]);
      return <span ref={ref} className={className}>{display}</span>;
    }

    // ——— Magnetic wrapper (subtle attraction on hover) ———
    function Magnetic({ children, strength = 0.25 }) {
      const ref = useRef(null);
      const onMove = (e) => {
        if (matchMedia('(pointer: coarse)').matches) return;
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * strength;
        const y = (e.clientY - r.top - r.height / 2) * strength;
        el.style.transform = `translate(${x}px, ${y}px)`;
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = ''; };
      return (
        <span ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
              className="inline-block will-change-transform"
              style={{ transition: 'transform .3s cubic-bezier(.2,.7,.2,1)' }}>
          {children}
        </span>
      );
    }

    // ——— Tilt wrapper (3D perspective on mouse) ———
    function Tilt({ children, max = 6, className = "" }) {
      const ref = useRef(null);
      const onMove = (e) => {
        if (matchMedia('(pointer: coarse)').matches) return;
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = `perspective(1200px) rotateX(${-y * max}deg) rotateY(${x * max}deg)`;
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = ''; };
      return (
        <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
             className={"tilt-wrap " + className}>
          {children}
        </div>
      );
    }

    // ——— Cursor glow (desktop) ———
    function CursorGlow() {
      const ref = useRef(null);
      useEffect(() => {
        if (matchMedia('(pointer: coarse)').matches) return;
        const el = ref.current; if (!el) return;
        const move = e => {
          el.style.left = e.clientX + 'px';
          el.style.top  = e.clientY + 'px';
        };
        window.addEventListener('pointermove', move);
        return () => window.removeEventListener('pointermove', move);
      }, []);
      return <div ref={ref} className="cursor-glow hidden md:block" />;
    }

    // ——— Custom cursor — small ring (lerps) + precise dot (1:1) + hover state ———
    function CustomCursor() {
      const ringRef = useRef(null);
      const dotRef  = useRef(null);
      useEffect(() => {
        if (matchMedia('(pointer: coarse)').matches) return;
        let mx = -100, my = -100, rx = -100, ry = -100, raf;
        const move = e => {
          mx = e.clientX; my = e.clientY;
          if (dotRef.current) dotRef.current.style.transform = `translate(${mx}px, ${my}px)`;
        };
        const tick = () => {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;
          if (ringRef.current) ringRef.current.style.transform = `translate(${rx}px, ${ry}px)`;
          raf = requestAnimationFrame(tick);
        };
        const onOver = e => {
          const t = e.target.closest && e.target.closest('a, button, [data-cursor="hover"]');
          document.documentElement.classList.toggle('cursor-hover', !!t);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerover', onOver);
        raf = requestAnimationFrame(tick);
        return () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerover', onOver);
          cancelAnimationFrame(raf);
          document.documentElement.classList.remove('cursor-hover');
        };
      }, []);
      return (
        <>
          <div ref={ringRef} className="custom-cursor hidden md:block" />
          <div ref={dotRef}  className="custom-cursor-dot hidden md:block" />
        </>
      );
    }

    // ——— Hero constellation — Canvas 2D star/connection field, cursor-reactive ———
    function HeroCanvas() {
      const ref = useRef(null);
      useEffect(() => {
        const canvas = ref.current; if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: true });
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let w = 0, h = 0, dpr = 1;
        let mx = -9999, my = -9999;
        let particles = [];
        let raf = 0;
        let active = true;

        // editorial palette stops: ink → ochre → amber → navy → olive
        // produces subtle graphite/spice pinpricks on paper, not neon
        const C = [
          [26, 24, 21],    // ink
          [139, 74, 42],   // deep accent
          [184, 83, 42],   // accent ochre
          [184, 145, 65], // amber (yeehai)
          [46, 91, 126],  // navy (ebay)
          [76, 107, 61],  // olive (ai startup)
        ];
        const lerp = (t) => {
          const s = Math.max(0, Math.min(1, t)) * (C.length - 1);
          const i = Math.floor(s);
          const f = s - i;
          const a = C[i], b = C[Math.min(C.length - 1, i + 1)];
          return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
        };

        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth;
          h = canvas.clientHeight;
          if (w === 0 || h === 0) return;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          ctx.setTransform(1,0,0,1,0,0);
          ctx.scale(dpr, dpr);
        };
        const init = () => {
          if (w === 0 || h === 0) return;
          // density: ~1 particle per 6500 px², capped at 220 for perf
          const count = Math.max(80, Math.min(220, Math.floor((w * h) / 6500)));
          particles = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            z: 0.3 + Math.random() * 0.7,           // depth (0..1) for parallax + size
            r: 0.8 + Math.random() * 1.3,           // base radius — smaller on paper
            hue: Math.random(),                     // 0..1 maps along editorial palette
            ph: Math.random() * Math.PI * 2,        // twinkle phase
            sp: 0.004 + Math.random() * 0.010,      // twinkle speed (slower = calmer)
            vx: (Math.random() - 0.5) * 0.06,       // drift x
            vy: (Math.random() - 0.5) * 0.06,       // drift y
          }));
        };

        const tick = () => {
          if (!active || w === 0 || h === 0) { raf = requestAnimationFrame(tick); return; }
          ctx.clearRect(0, 0, w, h);
          // gentle parallax offset based on cursor
          const parX = mx > -9000 ? (mx - w / 2) / w * 18 : 0;
          const parY = my > -9000 ? (my - h / 2) / h * 18 : 0;

          const pts = new Array(particles.length);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (!reduceMotion) {
              p.x += p.vx; p.y += p.vy;
              if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
              if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;
              p.ph += p.sp;
            }
            const px = p.x + parX * p.z;
            const py = p.y + parY * p.z;
            pts[i] = [px, py, p];
            const dx = px - mx, dy = py - my;
            const d = Math.hypot(dx, dy);
            const near = d < 240 ? 1 - d / 240 : 0;
            const tw = 0.6 + 0.4 * Math.abs(Math.sin(p.ph));
            const a = tw * (0.30 + p.z * 0.28) + near * 0.45;  // gentler alpha on paper
            const [r, g, b] = lerp(p.hue);
            const radius = p.r * (1 + near * 1.2);
            // soft ink halo for every particle — small, subtle, no glow
            const haloR = radius * (2.5 + near * 2.5);
            const haloA = (0.03 + p.z * 0.03) + near * 0.10;
            const grd = ctx.createRadialGradient(px, py, 0, px, py, haloR);
            grd.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${haloA})`);
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(px - haloR, py - haloR, haloR*2, haloR*2);
            // core
            ctx.beginPath();
            ctx.arc(px, py, radius, 0, 6.28318);
            ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${Math.min(0.8, a)})`;
            ctx.fill();
          }

          // constellation lines — hairlines in ink, barely there
          ctx.lineWidth = 0.6;
          const MAX = 130, MAX2 = MAX * MAX;
          for (let i = 0; i < pts.length; i++) {
            const [x1, y1] = pts[i];
            for (let j = i + 1; j < pts.length; j++) {
              const [x2, y2] = pts[j];
              const dx = x2 - x1, dy = y2 - y1;
              const d2 = dx*dx + dy*dy;
              if (d2 < MAX2) {
                const d = Math.sqrt(d2);
                const baseA = (1 - d / MAX) * 0.18;
                // boost lines near cursor
                const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
                const cd = Math.hypot(cx - mx, cy - my);
                const boost = cd < 240 ? (1 - cd / 240) * 0.25 : 0;
                const a = baseA + boost;
                ctx.strokeStyle = `rgba(26,24,21,${a})`;  // ink hairline
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
              }
            }
          }

          raf = requestAnimationFrame(tick);
        };

        const onMove = (e) => {
          const r = canvas.getBoundingClientRect();
          mx = e.clientX - r.left;
          my = e.clientY - r.top;
        };
        const onLeave = () => { mx = -9999; my = -9999; };

        const io = new IntersectionObserver(([e]) => { active = e.isIntersecting; }, { threshold: 0 });
        io.observe(canvas);

        resize(); init();
        const onResize = () => { resize(); init(); };
        window.addEventListener('resize', onResize);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerleave', onLeave);
        raf = requestAnimationFrame(tick);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', onResize);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerleave', onLeave);
          io.disconnect();
        };
      }, []);
      return <canvas ref={ref} className="hero-canvas" />;
    }

    // ——— Convergence SVG — 4 brand-color paths drawing in to one point ———
    function ConvergenceLines() {

        return () => io.disconnect();

        </svg>
      );
    }

    // ——— RFM 8x8 heatmap mockup — single-hue ochre scale (academic data-viz) ———
    function RfmGrid() {
      // Generate 64 cells. Score = recency+frequency mapped to a single ochre intensity.
      const cells = [];
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const noise = (Math.sin(r * 2.3 + f * 1.7) + 1) / 2 * 0.25;
          const score = Math.min(1, ((r + f) / 14) * 0.85 + noise);
          // Single-hue ochre ramp: paper (low) → deep accent (high)
          // interpolate between paper #E6DFCE and accent-lo #8F3E1E
          const R = 230 - score * (230 - 143); // 230 → 143
          const G = 223 - score * (223 - 62);  // 223 → 62
          const B = 206 - score * (206 - 30);  // 206 → 30
          const alpha = 0.35 + score * 0.60;
          cells.push({
            color: `rgba(${R|0}, ${G|0}, ${B|0}, ${alpha})`,
            delay: (r + f) * 35
          });
        }
      }
      return (
        <div className="flex gap-6 flex-wrap items-center">
          <div className="rfm-grid">
            {cells.map((c, i) => (
              <div key={i} className="rfm-cell"
                   style={{ background: c.color, animationDelay: `${c.delay}ms` }} />
            ))}
          </div>
          <div className="flex-1 min-w-[220px] max-w-[320px]">
            <div className="rfm-axis mb-3">x: 标签置信度 · y: 覆盖率</div>
            <div className="space-y-2 font-mono text-xs">
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:'rgba(230,223,206,.8)', border:'1px solid rgba(26,24,21,.12)'}} /><span className="text-fog-300">发布意图 / Post-intent</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:'rgba(204,175,130,.85)'}} /><span className="text-fog-300">高信息量 / High-info</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:'rgba(184,117,70,.9)'}} /><span className="text-fog-300">去处 / Venue</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:'rgba(165,87,48,.95)'}} /><span className="text-fog-300">兴趣 POI / Interest-POI</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:'rgba(143,62,30,1)'}} /><span className="text-fog-300">高置信样本 / Gold</span></div>
            </div>
          </div>
        </div>
      );
    }

    // ——— AOV growth chart (SVG line chart) ———
    function AovChart({ lang }) {
      // Normalized data — 6 months across, AOV index (lower y = higher AOV due to SVG inversion)
      // Pre-rollout flat-ish; post-rollout +15% step
      const pts = [
        { x: 60,  y: 150, label: 'v0' },
        { x: 180, y: 145, label: 'v1' },
        { x: 300, y: 130, label: 'v2' },
        { x: 420, y: 110, label: 'v3', accent: true },
        { x: 540, y:  85, label: 'v4' },
        { x: 660, y:  72, label: 'v5' },
        { x: 780, y:  60, label: 'v6' },
      ];
      const linePath = pts.reduce((acc, p, i) => acc + (i === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`), '');
      const areaPath = linePath + ` L ${pts[pts.length-1].x} 200 L ${pts[0].x} 200 Z`;
      return (
        <svg className="aov-chart" viewBox="0 0 840 220" preserveAspectRatio="none">
          <defs>
            <linearGradient id="aovArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="#B8532A" stopOpacity=".22" />
              <stop offset="100%" stopColor="#B8532A" stopOpacity="0" />

          {[40, 80, 120, 160, 200].map(y => (

              <circle cx={p.x} cy={p.y} r={p.accent ? 5 : 3.5}

          {/* +15% callout */}
          <g className="aov-point" style={{animationDelay: '1500ms'}}>
            <text x="700" y="50" fill="#B8532A" fontFamily="Space Grotesk" fontSize="22" fontWeight="600">90%+</text>

          </g>
        </svg>
      );
    }

    // ——— Reveal on scroll ———
    function Reveal({ children, delay = 0, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current; if (!el) return;
        const io = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) { el.classList.add('in'); io.disconnect(); } },
          { threshold: 0.12 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return (
        <div ref={ref} className={"reveal " + className} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    }
